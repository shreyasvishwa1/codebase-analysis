# Dependabot opens pull requests when a library has a newer or fixed version, so a newly
# published vulnerability is noticed without anyone having to check by hand.
#
# Major versions of the backend and frontend libraries are not proposed: they change APIs
# (React 19, Tailwind 4, redis 8 against arq's redis<6...) and need a deliberate, one library
# at a time upgrade. Minor and patch versions, which carry most security fixes, still come,
# and the Tests workflow checks each pull request before it is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

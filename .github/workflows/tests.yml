# Runs every check on each push and pull request: the full backend test suite against real
# PostgreSQL and Redis, plus type checks and lint, and the full frontend test suite, type check
# and production build. A failure shows up as a red cross on GitHub and on the README badge.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_se_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/ai_se_test
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/ai_se_migration_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install
        run: pip install -r requirements-dev.txt -c constraints.txt ruff==0.8.4

      # The app's settings need a SECRET_KEY even to migrate: a random one, used only here.
      - name: Prepare the test databases
        run: |
          PGPASSWORD=test createdb -h 127.0.0.1 -U test ai_se_migration_test
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            ENVIRONMENT=test DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

# Checks every pinned dependency against the public vulnerability databases on each push and
# pull request, and weekly (a library can become vulnerable without any change here). The run
# fails on a known vulnerability, which shows up as a red cross on GitHub and an email.
name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Backend packages (every pinned one, direct and indirect)
        run: |
          python -m pip install --disable-pip-version-check "pip-audit>=2.9,<3"
          pip-audit --strict --disable-pip --no-deps --requirement backend/constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend packages
        working-directory: frontend
        run: npm audit --audit-level=high

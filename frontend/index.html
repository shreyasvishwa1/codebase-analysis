<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071510" />
    <meta
      name="description"
      content="Repository intelligence: code quality, security, complexity, dependencies, architecture, a health score, an AI chat with citations and PDF reports."
    />
    <!-- Link previews (WhatsApp, LinkedIn, Slack, X): crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeBase Analysis" />
    <meta property="og:title" content="CodeBase Analysis: see inside any codebase before you touch it" />
    <meta
      property="og:description"
      content="One analysis checks quality, security, complexity, dependencies and architecture, scores the repository's health, and answers questions with cited lines."
    />
    <meta property="og:url" content="https://codebase-analysis.onrender.com/" />
    <meta property="og:image" content="https://codebase-analysis.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The CodeBase Analysis home page: five analysis modules wired into a health score" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23071510'/%3E%3Cg stroke='%23D4A23D' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M24 10v8M32 10v8M40 10v8M24 46v8M32 46v8M40 46v8M10 24h8M10 32h8M10 40h8M46 24h8M46 32h8M46 40h8'/%3E%3C/g%3E%3Crect x='18' y='18' width='28' height='28' rx='3' fill='%230D2119' stroke='%23D4A23D' stroke-width='3'/%3E%3Ccircle cx='25' cy='25' r='2.5' fill='%23D4A23D'/%3E%3C/svg%3E"
    />
    <script>
      // The theme is chosen before the first paint: the saved choice, else the system setting.
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('cba-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CodeBase Analysis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
